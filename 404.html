<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 o’Kay Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,900;1,6..96,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--blue:#2748ff;--ink:#0a0a0a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;font-family:'Inter',system-ui,sans-serif;color:#e8e8e8;background-color:var(--bg);
background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px;overflow:hidden}
.b{position:fixed;width:min(40vw,300px);aspect-ratio:1;border-radius:50%;background:#262626;right:-6%;top:8%;z-index:0;opacity:.9}
main{position:relative;z-index:1;max-width:560px}
.tag{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:#8398ff}
h1{font-family:'Bodoni Moda',serif;font-weight:900;font-size:clamp(7rem,32vw,16rem);line-height:.8;letter-spacing:-.05em;margin:18px 0 22px;color:transparent;-webkit-text-stroke:3px #fff;
background:linear-gradient(100deg,#fff 0 36%,transparent 70%),radial-gradient(circle,var(--blue) 30%,transparent 32%) 0 0/8px 8px,#fff;-webkit-background-clip:text;background-clip:text}
h2{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:500;font-size:1.4rem;margin-bottom:8px}
p{font-size:.92rem;opacity:.85;margin-bottom:26px}
a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;font-size:.85rem;padding:13px 28px;border-radius:99px;border:2px solid var(--blue);transition:.2s}
a:hover{background:var(--ink);border-color:var(--ink)}
</style>
</head>
<body>
<div class="b"></div>
<main>
<p class="tag" id="t" style="margin-bottom:0;opacity:1">Error · Page not found</p>
<h1>404</h1>
<h2 id="h">This page wandered off the map.</h2>
<p id="p">Gamedev? o’Kay. Let’s get you back to the main quest.</p>
<a id="home" href="/">← Back to home</a>
</main>
<script>
/* Project site (username.github.io/repo-name/)? Set BASE to "/repo-name/". User site or custom domain: leave "/". */
const BASE="/";
let l="en";try{l=localStorage.getItem("lang")==="id"?"id":"en"}catch(e){}
document.documentElement.lang=l;
document.getElementById("home").href=BASE;
if(l==="id"){
document.getElementById("t").textContent="Error · Halaman tidak ditemukan";
document.getElementById("h").textContent="Halaman ini nyasar dari peta.";
document.getElementById("p").textContent="Gamedev? o’Kay. Yuk balik ke main quest.";
document.getElementById("home").textContent="← Kembali ke beranda";
}
</script>
</body>
</html>
